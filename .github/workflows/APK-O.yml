name:  APK-o Build

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: APK-O
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
      
      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/takagen99/Box.git
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
        env:
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx4g -XX:MaxMetaspaceSize=1g
        
      - name: DIY
        run: |
          cd Box
           
          if [ -f "diy-99.sh" ]; then
            chmod +x diy-99.sh
            bash diy-99.sh
          fi
        
      - name: Build With Gradle
        run: |
          cd Box
          echo "sdk.dir=\$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblerelease \--build-cache \--parallel \-Dorg.gradle.internal.publish.checksums.insecure=true
        
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }}/Box -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;
        
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc-${{ github.run_id }}
          path: ${{ github.workspace }}/apk/*

