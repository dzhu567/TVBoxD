name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 生成缺失的 local.properties (核心修复!)
        run: |
          cd TVBoxOS
          # 自动生成 local.properties，指定 SDK 路径（CI 环境下 Android SDK 已由 setup-java 配置）
          echo "sdk.dir=/usr/lib/android-sdk" > local.properties
          echo "ndk.dir=/usr/lib/android-sdk/ndk-bundle" >> local.properties

      - name: 🔥 清理 build.gradle 报错行
        run: |
          cd TVBoxOS/app
          # 删除所有和 pyramid 相关的报错行
          sed -i '/pyramid/d' build.gradle
          # 查看修复后的文件
          head -n 170 build.gradle

      - name: Build with Gradle
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Final
          path: apk/*
