name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 生成 local.properties
        run: |
          mkdir -p /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/
          echo "sdk.dir=/usr/lib/android-sdk" > /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties

      - name: 🔥 彻底禁用 pyramid 模块
        run: |
          cd TVBoxOS
          sed -i '/pyramid/d' settings.gradle
          sed -i '/pyramid/d' app/build.gradle

      - name: 🔥 注释掉 ApiConfig.java 里的 proxyLocal 调用 (核心修复!)
        run: |
          cd TVBoxOS/app/src/main/java/com/github/tvbox/osc/api/
          # 注释第 965 行和第 968 行
          sed -i '965s/^/\/\//' ApiConfig.java
          sed -i '968s/^/\/\//' ApiConfig.java
          # 查看修改结果
          sed -n '960,975p' ApiConfig.java

      - name: Build with Gradle
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Final
          path: apk/*
