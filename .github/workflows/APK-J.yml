name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 生成 local.properties
        run: |
          mkdir -p /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/
          echo "sdk.dir=/usr/lib/android-sdk" > /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties

      - name: 🔥 修复 build.gradle 语法 + 补全注解依赖
        run: |
          cd TVBoxOS/app
          # 1. 删除第 146 行报错的 pythonImplementation 行
          sed -i '146d' build.gradle
          # 2. 删除所有 pyramid 相关引用
          sed -i '/pyramid/d' build.gradle
          # 3. 在 dependencies 块末尾添加 ContextSetter 依赖（兼容 AndroidX）
          sed -i '/dependencies {/a \    implementation "androidx.core:core:1.12.0"\n    implementation "androidx.core:core-ktx:1.12.0"' build.gradle

      - name: 🔥 修复 Java 代码里的注解 + proxyLocal 调用
        run: |
          cd TVBoxOS
          # 1. 注释掉 Global.java 里的 @ContextSetter 注解
          find . -name "Global.java" -exec sed -i 's/@ContextSetter//g' {} \;
          # 2. 替换所有 proxyLocal 调用为 return null;
          find . -name "*.java" -exec sed -i 's/return PythonLoader.*proxyLocal.*/return null;/g' {} \;

      - name: Build with Gradle (跳过 Python 任务)
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease -x compilePythonReleaseJavaWithJavac -x lint

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Final
          path: apk/*
