name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 生成 local.properties
        run: |
          mkdir -p /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/
          echo "sdk.dir=/usr/lib/android-sdk" > /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties

      - name: 🔥 温和清理 Python 相关代码 (不破坏 build.gradle 语法)
        run: |
          cd TVBoxOS
          # 1. 彻底删除 settings.gradle 里的 pyramid 引用
          sed -i '/pyramid/d' settings.gradle
          
          # 2. 只删除 app/build.gradle 里的 Python 插件行，不追加任何代码
          sed -i '/id.*python/d' app/build.gradle
          
          # 3. 全局替换所有 proxyLocal 调用为 return null;
          find . -name "*.java" -exec sed -i 's/return PythonLoader.*proxyLocal.*/return null;/g' {} \;

      - name: Build with Gradle (跳过 Python 任务)
        run: |
          cd TVBoxOS
          chmod +x gradlew
          # 直接跳过 Python 编译任务，不从 build.gradle 里改
          ./gradlew assembleRelease -x compilePythonReleaseJavaWithJavac -x lint

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Stable
          path: apk/*
