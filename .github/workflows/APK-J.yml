name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 彻底修复 build.gradle 语法错误 (核心!)
        run: |
          cd TVBoxOS/app
          # 删除第147行和第165行这两个报错点
          sed -i '147d;165d' build.gradle
          # 查看修复后的文件，确认没有报错行
          head -n 170 build.gradle

      - name: Build with Gradle
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Final
          path: apk/*
