name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 精确生成缺失的 local.properties (核心修复!)
        run: |
          # 完全匹配报错日志里的路径
          mkdir -p /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/
          echo "sdk.dir=/usr/lib/android-sdk" > /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties
          echo "ndk.dir=/usr/lib/android-sdk/ndk-bundle" >> /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties

      - name: 🔥 彻底禁用 :pyramid 模块 (终极保险)
        run: |
          cd TVBoxOS
          # 在 settings.gradle 里删除 pyramid 模块引用
          sed -i '/pyramid/d' settings.gradle
          # 删除 app/build.gradle 里所有 pyramid 依赖
          sed -i '/pyramid/d' app/build.gradle

      - name: Build with Gradle
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Final
          path: apk/*
