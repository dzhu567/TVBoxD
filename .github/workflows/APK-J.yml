name: APK-J Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Clone Project
        run: git clone -b main --depth=1 https://github.com/q215613905/TVBoxOS.git

      - name: Run DIY Script
        run: |
          chmod +x diy-J.sh
          bash $GITHUB_WORKSPACE/diy-J.sh

      - name: 🔥 生成 local.properties
        run: |
          mkdir -p /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/
          echo "sdk.dir=/usr/lib/android-sdk" > /home/runner/work/TVBoxD/TVBoxD/TVBoxOS/local.properties

      - name: 🔥 彻底清理 Python 相关代码 (核心终极修复!)
        run: |
          cd TVBoxOS
          # 1. 彻底删除 settings.gradle 里的 pyramid 引用
          sed -i '/pyramid/d' settings.gradle
          
          # 2. 删除 app/build.gradle 里的 Python 插件和依赖
          sed -i '/python/d' app/build.gradle
          sed -i '/Pyramid/d' app/build.gradle
          
          # 3. 全局替换所有调用 proxyLocal 的代码为 return null; (强制阻断!)
          # 原理：用空代码替换报错方法，让编译器跳过
          find . -name "*.java" -exec sed -i 's/return PythonLoader.*proxyLocal.*/return null;/g' {} \;
          
          # 4. 禁用 Python 编译任务（在 build.gradle 里加代码阻断）
          echo -e "\nproject(':app').tasks.findByName('compilePythonReleaseJavaWithJavac')?.enabled = false" >> app/build.gradle

      - name: Build with Gradle
        run: |
          cd TVBoxOS
          chmod +x gradlew
          ./gradlew assembleRelease -x lint

      - name: Collect APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk
          find . -name "*.apk" -exec mv {} $GITHUB_WORKSPACE/apk/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-OSC-Stable
          path: apk/*
